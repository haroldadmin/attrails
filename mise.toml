[tools]
rust = { version = "1.98.0", components = ["rust-analyzer", "rust-src"] }
"cargo:jacquard-lexgen" = "0.12.2"
"cargo:kdlfmt" = "latest"
node = "26.12.1"
pnpm = "12.14.0"
# Keep in sync with the sqlx version in crates/database.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls,sqlx-toml" }
"cargo:cargo-typify" = "0.8.0"
jq = "1.8.2"

[tasks."db:migrate"]
description = "Apply pending Postgres migrations"
dir = "{{config_root}}/crates/database"
run = "sqlx migrate run"

[tasks."db:migrate:check"]
description = "List pending Postgres migrations without applying them"
dir = "{{config_root}}/crates/database"
run = "sqlx migrate run --dry-run"

[tasks."db:sqlx:prepare"]
description = "Prepare offline query information for CI runs. Run this everytime a new query is added."
dir = "{{config_root}}/crates/database"
run = "cargo sqlx prepare --config sqlx.toml"

[tasks."web:db:codegen"]
description = "Generate the frontend's Kysely types from the migrated Postgres schema"
dir = "{{config_root}}/web"
run = "pnpm db:codegen"

[tasks."moderation:codegen"]
description = "Generate TypeSafe API types from the vendored OpenAPI spec"
dir = "{{config_root}}/crates/moderation"
run = """
jq '{"$schema": "https://json-schema.org/draft/2020-12/schema", definitions: .components.schemas}' typesafe/openapi.json \
  | sed 's#/components/schemas/#/definitions/#g' > target-schemas.json
cargo typify target-schemas.json --output src/typesafe/generated.rs --no-builder
rm target-schemas.json
"""
