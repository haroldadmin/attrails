[workspace]
resolver = "3"
members = [
  "crates/amqp",
  "crates/database",
  "crates/ingest-consumer",
  "crates/ingest-watcher",
  "crates/lexicons",
  "crates/lifecycle",
  "crates/tracks",
  "crates/moderation",
  "crates/telemetry",
]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
