name: attrails

services:
  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  tap:
    image: ghcr.io/bluesky-social/indigo/tap:latest
    environment:
      TAP_SIGNAL_COLLECTION: app.attrails.actor.profile
      TAP_COLLECTION_FILTERS: app.attrails.*
      TAP_LOG_LEVEL: info
    ports:
      - "2480:2480"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2480/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Each service has its own profile, so the one being worked on can run with
  # cargo while compose provides everything else, e.g. while developing the
  # watcher: `docker compose --profile consumer up`.
  ingest-watcher:
    profiles: [watcher]
    build:
      context: .
      dockerfile: crates/ingest-watcher/Dockerfile
    env_file: .env
    environment:
      ATTRAILS_RABBITMQ_HOST: amqp://app:app@rabbitmq:5672
      ATTRAILS_TAP_URL: tap:2480
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      tap:
        condition: service_healthy

  ingest-consumer:
    profiles: [consumer]
    build:
      context: .
      dockerfile: crates/ingest-consumer/Dockerfile
    # Postgres is not part of this file; its connection uri comes from .env.
    env_file: .env
    environment:
      ATTRAILS_RABBITMQ_HOST: amqp://app:app@rabbitmq:5672
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
