[package]
name = "lifecycle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["io-util", "macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
