[package]
name = "lexicons"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# Keep in sync with the installed jacquard-lexgen (lex-fetch) version.
jacquard-common = "0.12"
jacquard-derive = "0.12"
jacquard-lexicon = { version = "0.12", default-features = false }
miette = "7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints.rust]
non_snake_case = "allow"
unused_imports = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[features]
default = ["com_atproto", "app_attrails"]
streaming = ["jacquard-common/websocket"]

# --- generated ---
# Generated namespace features
app_attrails = ["com_atproto"]
app_bsky = ["com_atproto"]
chat_bsky = ["app_bsky"]
com_atproto = []
com_germnetwork = []
internal_bsky = []
site_standard = ["com_atproto"]
tools_ozone = ["app_bsky", "chat_bsky", "com_atproto"]
