[package]
name = "amqp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
lapin = "4.12.1"
opentelemetry = "0.33.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"

[dev-dependencies]
opentelemetry_sdk = "0.33.1"
tracing-subscriber = "0.3.23"

[lints]
workspace = true
