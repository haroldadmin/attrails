[package]
name = "ingest-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
envy = "0.4.2"
amqp = { path = "../amqp" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
lapin = "4.12.1"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing = "0.1.44"
lexicons = { path = "../lexicons" }
lifecycle = { path = "../lifecycle" }
atproto-tap = "0.14.5"
database = { path = "../database" }
jiff = "0.2"
tracks = { path = "../tracks" }
jacquard = { version = "0.12.2", default-features = false, features = ["api"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
thiserror = "2.0.21"
geojson = "1.0.0"
sha2 = "0.11.0"

[lints]
workspace = true
