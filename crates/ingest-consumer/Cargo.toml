[package]
name = "ingest-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
envy = "0.4.2"
amqp = { path = "../amqp" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
