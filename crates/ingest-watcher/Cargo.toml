[package]
name = "ingest-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
atproto-tap = "0.14.5"
dotenvy = "0.15.7"
envy = "0.4.2"
lapin = "4.12.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
amqp = { path = "../amqp" }
serde_json = "1.0.154"

[lints]
workspace = true
